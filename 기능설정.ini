; AI 모드 기능 끄기/켜기 설정
; 1 = 켜기, 0 = 끄기. 바꾼 뒤 게임을 다시 시작하면 적용됩니다.
; 이 파일이 없거나 항목이 없으면 모두 켜진 상태로 동작합니다.

[groups]
; 큰 묶음 켜기/끄기. 1 = 켬, 0 = 끔. 게임을 다시 시작하면 적용됩니다.
; 전투 판단(SAN14_CombatAI.dll). 0이면 로더가 전투 모듈을 불러오지 않습니다.
combat=1
; 편의 기능 전체(아래 [features] 포함). 0이면 편의 모듈은 자기 기능을 하나도 연결하지 않습니다.
convenience=1
; 진행 가속(거리 계산·원작 이름 탐색). 세부 스위치는 progress_native.ini.
performance=1


[features]
; 논공 친애 확장: 논공 시 추가 친애, 열전의 논공 친애 표시, 논공 효과 변경
; 0으로 꺼도 기존 세이브의 논공 기록과 명품창고 저장은 그대로 보존됩니다.
merit=1

; 개성 9칸 해금 + 포획 대사 표시
; 0으로 끄면 원작처럼 5칸만 효과가 적용됩니다. (세이브의 9칸 값은 보존)
traits9=1

; 부상 무장 보호와 컴퓨터 세력의 본초학 시정 자동 배치
injury=1

; 전략 화면의 통합 인사 버튼과 출진 전법 자동 선택
unified=1

; 거점 자동점령 연출 시간 약 절반(카메라 이동·점령 효과·대기). 천시 등 다른 메시지는 그대로
occupy_fast=1
