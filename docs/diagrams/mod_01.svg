<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 333" width="680" height="333" role="img" aria-label="군단 공통 준비: 바뀌는 곳은 공격 검토를 시작하는 시기 하나입니다."><defs><marker id="ar10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",