<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 813" width="680" height="813" role="img" aria-label="야전 — 부대: 원작 우선순위 목록 앞에 모드 판단이 하나 더 들어갑니다."><defs><marker id="ar15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">부대 하나 · 매일</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar15)"/><rect x="40" y="70" width="600" height="94" rx="5" class="m"/><path d="M45,70 h41 v94 h-41 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="121.0" class="mk" text-anchor="middle">추가</text><text x="98.0" y="94.0" class="mt">모드 우선순위를 먼저 판단</text><circle cx="624" cy="89" r="5" class="led"/><text x="612.0" y="93.0" class="mkey" text-anchor="end">전투 AI 교정</text><text x="98.0" y="115.0" class="u2">모드가 관리하는 출진 부대는 복귀·공성 고정·사기 회복을 먼저 봅니다. 여기서</text><text x="98.0" y="132.0" class="u2">정해지면 원작 판단을 건너뜁니다.</text><text x="98.0" y="148.0" class="k">컴퓨터만</text><polyline points="190.0,164.0 190.0,190.0" class="w" marker-end="url(#ar15)"/><rect x="40" y="190" width="600" height="94" rx="5" class="m"/><path d="M45,190 h41 v94 h-41 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="241.0" class="mk" text-anchor="middle">추가</text><text x="98.0" y="214.0" class="mt">사기 회복 우선</text><circle cx="624" cy="209" r="5" class="led"/><text x="612.0" y="213.0" class="mkey" text-anchor="end">morale</text><text x="98.0" y="235.0" class="u2">사기 85 이하인 부대는 가까운 자기 군악대 옆에서 사기 100까지 기다립니다. 70</text><text x="98.0" y="252.0" class="u2">이하이거나 산지면 더 먼 군악대도 찾고, 없으면 군악대를 짓습니다.</text><text x="98.0" y="268.0" class="k">컴퓨터만</text><polyline points="190.0,284.0 190.0,310.0" class="w" marker-end="url(#ar15)"/><rect x="40" y="310" width="300" height="66" rx="4" class="n og"/><text x="52.0" y="332.0" class="tt">원작 우선순위 목록</text><text x="52.0" y="348.0" class="u">화염 회피 → 위보 → 화계 → 병참 회복 → 주변</text><text x="52.0" y="364.0" class="u">점령 → 병참 절단 → 위치 이동 → 수리</text><polyline points="190.0,376.0 190.0,402.0" class="w" marker-end="url(#ar15)"/><rect x="40" y="402" width="600" height="111" rx="5" class="m"/><path d="M45,402 h41 v111 h-41 a5,5 0 0 1 -5,-5 v-101 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="461.5" class="mk" text-anchor="middle">변경</text><text x="98.0" y="426.0" class="mt">병참 절단 대상을 플레이어 부대로만</text><circle cx="624" cy="421" r="5" class="led"/><text x="612.0" y="425.0" class="mkey" text-anchor="end">combat_cut</text><text x="98.0" y="447.0" class="u2">지력별 반경 6·9·12·15칸과 통솔·지력 65 조건은 원작 그대로.</text><text x="98.0" y="464.0" class="u2">후보 중 플레이어 부대만 남깁니다. 급한 일이 없으면 먼저 시도하고, 귀환·교전·본거지</text><text x="98.0" y="481.0" class="u2">방어·공성 고정 중이면 건너뜁니다.</text><text x="98.0" y="497.0" class="k">컴퓨터만</text><polyline points="190.0,513.0 190.0,539.0" class="w" marker-end="url(#ar15)"/><rect x="40" y="539" width="300" height="34" rx="4" class="n og"/><text x="52.0" y="561.0" class="tt">시설 건설 허가 확인</text><polyline points="190.0,573.0 190.0,599.0" class="w" marker-end="url(#ar15)"/><rect x="40" y="599" width="600" height="94" rx="5" class="m"/><path d="M45,599 h41 v94 h-41 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z" class="ms blk"/><text x="63.0" y="650.0" class="mk" text-anchor="middle">차단</text><text x="98.0" y="623.0" class="mt">컴퓨터의 방벽·투석대 건설 제한</text><circle cx="624" cy="618" r="5" class="led"/><text x="612.0" y="622.0" class="mkey" text-anchor="end">ai_wall_block · ai_catapult_block</text><text x="98.0" y="644.0" class="u2">방벽·관문을 새로 짓지 않습니다. 플레이어 성·관문이 있는 지역과 바로 붙은</text><text x="98.0" y="661.0" class="u2">지역에서는 투석대를 지을 수 없습니다.</text><text x="98.0" y="677.0" class="k">컴퓨터만</text><polyline points="190.0,693.0 190.0,719.0" class="w" marker-end="url(#ar15)"/><rect x="40" y="719" width="600" height="78" rx="5" class="m"/><path d="M45,719 h41 v78 h-41 a5,5 0 0 1 -5,-5 v-68 a5,5 0 0 1 5,-5 z" class="ms blk"/><text x="63.0" y="762.0" class="mk" text-anchor="middle">차단</text><text x="98.0" y="743.0" class="mt">군사시설 2칸 간격</text><circle cx="624" cy="738" r="5" class="led"/><text x="612.0" y="742.0" class="mkey" text-anchor="end">전투 AI 교정</text><text x="98.0" y="764.0" class="u2">모드 건설은 지도에 이미 있는 군사시설(미완성 포함) 2칸 안을 고르지 않습니다. 원작</text><text x="98.0" y="781.0" class="u2">AI가 스스로 내는 건설 명령은 그대로입니다.</text></svg>