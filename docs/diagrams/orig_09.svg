ono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">부대 하나 · 매일</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar9)"/><rect x="40" y="70" width="300" height="264" rx="3" class="ch"/><line x1="40" y1="96" x2="340" y2="96" class="w2"/><text x="52.0" y="88.0" class="tt">우선순위 (성공하면 거기서 끝)</text><line x1="28" y1="109" x2="40" y2="109" class="w2"/><rect x="24" y="106" width="6" height="6" class="pin"/><text x="52.0" y="113.0" class="u2">1</text><text x="328.0" y="113.0" class="ov" text-anchor="end">화염 회피</text><line x1="28" y1="131" x2="40" y2="131" class="w2"/><rect x="24" y="128" width="6" height="6" class="pin"/><text x="52.0" y="135.0" class="u2">2</text><text x="328.0" y="135.0" class="ov" text-anchor="end">위보 해소</text><line x1="48" y1="120" x2="332" y2="120" class="rl"/><line x1="28" y1="153" x2="40" y2="153" class="w2"/><rect x="24" y="150" width="6" height="6" class="pin"/><text x="52.0" y="157.0" class="u2">3</text><text x="328.0" y="157.0" class="ov" text-anchor="end">위보 시도</text><line x1="48" y1="142" x2="332" y2="142" class="rl"/><line x1="28" y1="175" x2="40" y2="175" class="w2"/><rect x="24" y="172" width="6" height="6" class="pin"/><text x="52.0" y="179.0" class="u2">4</text><text x="328.0" y="179.0" class="ov" text-anchor="end">화계 시도 (사기 50↑ · 확률 25↑)</text><line x1="48" y1="164" x2="332" y2="164" class="rl"/><line x1="28" y1="197" x2="40" y2="197" class="w2"/><rect x="24" y="194" width="6" height="6" class="pin"/><text x="52.0" y="201.0" class="u2">5</text><text x="328.0" y="201.0" class="ov" text-anchor="end">병참 회복</text><line x1="48" y1="186" x2="332" y2="186" class="rl"/><line x1="28" y1="219" x2="40" y2="219" class="w2"/><rect x="24" y="216" width="6" height="6" class="pin"/><text x="52.0" y="223.0" class="u2">6</text><text x="328.0" y="223.0" class="ov" text-anchor="end">인접 명승 · 지역 중심 점령</text><line x1="48" y1="208" x2="332" y2="208" class="rl"/><line x1="28" y1="241" x2="40" y2="241" class="w2"/><rect x="24" y="238" width="6" height="6" class="pin"/><text x="52.0" y="245.0" class="u2">7</text><text x="328.0" y="245.0" class="ov" text-anchor="end">독 회피</text><line x1="48" y1="230" x2="332" y2="230" class="rl"/><line x1="28" y1="263" x2="40" y2="263" class="w2"/><rect x="24" y="260" width="6" height="6" class="pin"/><text x="52.0" y="267.0" class="u2">8</text><text x="328.0" y="267.0" class="ov" text-anchor="end">적 병참 절단</text><line x1="48" y1="252" x2="332" y2="252" class="rl"/><line x1="28" y1="285" x2="40" y2="285" class="w2"/><rect x="24" y="282" width="6" height="6" class="pin"/><text x="52.0" y="289.0" class="u2">9</text><text x="328.0" y="289.0" class="ov" text-anchor="end">유리한 위치로 이동</text><line x1="48" y1="274" x2="332" y2="274" class="rl"/><line x1="28" y1="307" x2="40" y2="307" class="w2"/><rect x="24" y="304" width="6" height="6" class="pin"/><text x="52.0" y="311.0" class="u2">10</text><text x="328.0" y="311.0" class="ov" text-anchor="end">인접 시설 수리</text><line x1="48" y1="296" x2="332" y2="296" class="rl"/><text x="330.0" y="328.0" class="k" text-anchor="end">N7</text><polyline points="190.0,334.0 190.0,360.0" class="w" marker-end="url(#ar9)"/><rect x="80" y="360" width="220" height="28" rx="14" class="en"/><text x="190.0" y="378.5" class="pt" text-anchor="middle">8번 · 적 병참 절단 자세히</text><polyline points="190.0,388.0 190.0,414.0" class="w" marker-end="url(#ar9)"/><polygon points="58.0,414.0 322.0,414.0 340.0,443.0 322.0,472.0 58.0,472.0 40.0,443.0" class="d"/><text x="190.0" y="439.0" class="tt" text-anchor="middle">통솔이나 지력이 65 이상이고 군세가</text><text x="190.0" y="457.0" class="tt" text-anchor="middle">방식 8이 아닌가 ?</text><polyline points="340.0,443.0 400.0,443.0" class="w" marker-end="url(#ar9)"/><text x="346.0" y="437.0" class="l">아니오</text><rect x="400" y="426.5" width="240" height="33" rx="14" class="sp"/><text x="412.0" y="447.5" class="u2">실패 → 9번으로</text><polyline points="190.0,472.0 190.0,498.0" class="w" marker-end="url(#ar9)"/><text x="198.0" y="487.0" class="l">예</text><polygon points="58.0,498.0 322.0,498.0 340.0,518.0 322.0,538.0 58.0,538.0 40.0,518.0" class="d"/><text x="190.0" y="523.0" class="tt" text-anchor="middle">바로 옆 칸에 적 부대가 없는가 ?</text><polyline points="340.0,518.0 400.0,518.0" class="w" marker-end="url(#ar9)"/><text x="346.0" y="512.0" class="l">있다</text><rect x="400" y="501.5" width="240" height="33" rx="14" class="sp"/><text x="412.0" y="522.5" class="u2">실패 → 9번으로</text><polyline points="190.0,538.0 190.0,564.0" class="w" marker-end="url(#ar9)"/><text x="198.0" y="553.0" class="l">예</text><rect x="40" y="564" width="300" height="132" rx="3" class="ch"/><line x1="40" y1="590" x2="340" y2="590" class="w2"/><text x="52.0" y="582.0" class="tt">주장 지력 → 감지 반경</text><line x1="28" y1="603" x2="40" y2="603" class="w2"/><rect x="24" y="600" width="6" height="6" class="pin"/><text x="52.0" y="607.0" class="u2">64 이하</text><text x="328.0" y="607.0" class="ov" text-anchor="end">6칸</text><line x1="28" y1="625" x2="40" y2="625" class="w2"/><rect x="24" y="622" width="6" height="6" class="pin"/><text x="52.0" y="629.0" class="u2">65~74</text><text x="328.0" y="629.0" class="ov" text-anchor="end">9칸</text><line x1="48" y1="614" x2="332" y2="614" class="rl"/><line x1="28" y1="647" x2="40" y2="647" class="w2"/><rect x="24" y="644" width="6" height="6" class="pin"/><text x="52.0" y="651.0" class="u2">75~84</text><text x="328.0" y="651.0" class="ov" text-anchor="end">12칸</text><line x1="48" y1="636" x2="332" y2="636" class="rl"/><line x1="28" y1="669" x2="40" y2="669" class="w2"/><rect x="24" y="666" width="6" height="6" class="pin"/><text x="52.0" y="673.0" class="u2">85 이상</text><text x="328.0" y="673.0" class="ov" text-anchor="end">15칸</text><line x1="48" y1="658" x2="332" y2="658" class="rl"/><text x="330.0" y="690.0" class="k" text-anchor="end">D1760</text><polyline points="190.0,696.0 190.0,722.0" class="w" marker-end="url(#ar9)"/><rect x="40" y="722" width="300" height="66" rx="4" class="n"/><text x="52.0" y="744.0" class="tt">대상 고르기</text><text x="52.0" y="760.0" class="u">반경 안에서 병참이 이어진 적 부대 중 끊기</text><text x="52.0" y="776.0" class="u">가장 쉬운 부대</text><polyline points="190.0,788.0 190.0,814.0" class="w" marker-end="url(#ar9)"/><rect x="40" y="814" width="300" height="49" rx="4" class="c"/><rect x="44" y="818" width="292" height="41" rx="2" class="ci"/><text x="52.0" y="836.0" class="tt">▶ 차단 지점까지 경유점을 쓰고 이동</text><text x="330.0" y="851.0" class="k" text-anchor="end">26E260</text></svg>