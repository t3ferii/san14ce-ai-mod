<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" width="680" height="306" role="img" aria-label="야전 — 군세가 임무를 고르는 표: 나간 군세는 매일 행동종류에 맞는 실행 노드 하나로 갑니다."><defs><marker id="ar7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">군세 행동종류 읽기</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar7)"/><rect x="40" y="70" width="600" height="220" rx="3" class="ch"/><line x1="40" y1="96" x2="640" y2="96" class="w2"/><text x="52.0" y="88.0" class="tt">행동종류 → 실행</text><line x1="28" y1="109" x2="40" y2="109" class="w2"/><rect x="24" y="106" width="6" height="6" class="pin"/><text x="52.0" y="113.0" class="u2">8 · 9 · 10 · 11 · 22</text><text x="628.0" y="113.0" class="ov" text-anchor="end">성 공격 → 끝나면 대기(7)</text><line x1="28" y1="131" x2="40" y2="131" class="w2"/><rect x="24" y="128" width="6" height="6" class="pin"/><text x="52.0" y="135.0" class="u2">3 · 13 · 14</text><text x="628.0" y="135.0" class="ov" text-anchor="end">지역 공격 · 중계 지역 공격</text><line x1="48" y1="120" x2="632" y2="120" class="rl"/><line x1="28" y1="153" x2="40" y2="153" class="w2"/><rect x="24" y="150" width="6" height="6" class="pin"/><text x="52.0" y="157.0" class="u2">1</text><text x="628.0" y="157.0" class="ov" text-anchor="end">요격 → 대기(7) 또는 종료(0)</text><line x1="48" y1="142" x2="632" y2="142" class="rl"/><line x1="28" y1="175" x2="40" y2="175" class="w2"/><rect x="24" y="172" width="6" height="6" class="pin"/><text x="52.0" y="179.0" class="u2">4</text><text x="628.0" y="179.0" class="ov" text-anchor="end">시설 공격</text><line x1="48" y1="164" x2="632" y2="164" class="rl"/><line x1="28" y1="197" x2="40" y2="197" class="w2"/><rect x="24" y="194" width="6" height="6" class="pin"/><text x="52.0" y="201.0" class="u2">5</text><text x="628.0" y="201.0" class="ov" text-anchor="end">건설 (진행만 확인)</text><line x1="48" y1="186" x2="632" y2="186" class="rl"/><line x1="28" y1="219" x2="40" y2="219" class="w2"/><rect x="24" y="216" width="6" height="6" class="pin"/><text x="52.0" y="223.0" class="u2">23</text><text x="628.0" y="223.0" class="ov" text-anchor="end">자동 영역 방어</text><line x1="48" y1="208" x2="632" y2="208" class="rl"/><line x1="28" y1="241" x2="40" y2="241" class="w2"/><rect x="24" y="238" width="6" height="6" class="pin"/><text x="52.0" y="245.0" class="u2">7</text><text x="628.0" y="245.0" class="ov" text-anchor="end">대기 · 목표가 생기면 방식 번호로</text><line x1="48" y1="230" x2="632" y2="230" class="rl"/><line x1="28" y1="263" x2="40" y2="263" class="w2"/><rect x="24" y="260" width="6" height="6" class="pin"/><text x="52.0" y="267.0" class="u2">0</text><text x="628.0" y="267.0" class="ov" text-anchor="end">퇴각 · 종료</text><line x1="48" y1="252" x2="632" y2="252" class="rl"/><text x="630.0" y="284.0" class="k" text-anchor="end">N0~N347</text></svg>