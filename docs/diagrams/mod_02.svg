<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1267" width="680" height="1267" role="img" aria-label="출진 — 성 공격: 출진 여부의 식은 원작 그대로입니다. 모드는 평가값, 편성, 출진 직후의 회군을 고칩니다."><defs><marker id="ar11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">성 공격 검토</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="70" width="300" height="34" rx="4" class="n og"/><text x="52.0" y="92.0" class="tt">공격 목표 후보를 모음</text><polyline points="190.0,104.0 190.0,130.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="130" width="600" height="94" rx="5" class="m"/><path d="M45,130 h41 v94 h-41 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z" class="ms blk"/><text x="63.0" y="181.0" class="mk" text-anchor="middle">차단</text><text x="98.0" y="154.0" class="mt">이민족 성은 목표에서 뺌</text><circle cx="624" cy="149" r="5" class="led"/><text x="612.0" y="153.0" class="mkey" text-anchor="end">no_tribe_target</text><text x="98.0" y="175.0" class="u2">컴퓨터 세력은 이민족 성을 차지할 수 없어 원작 검토와 모드 목표 선택 모두에서</text><text x="98.0" y="192.0" class="u2">뺍니다.</text><text x="98.0" y="208.0" class="k">컴퓨터만</text><polyline points="190.0,224.0 190.0,250.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="250" width="300" height="34" rx="4" class="n og"/><text x="52.0" y="272.0" class="tt">목표기준(목표 주변 전투력) 계산</text><polyline points="190.0,284.0 190.0,310.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="310" width="600" height="94" rx="5" class="m"/><path d="M45,310 h41 v94 h-41 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="361.0" class="mk" text-anchor="middle">변경</text><text x="98.0" y="334.0" class="mt">목표 성 전투력을 70%로 평가</text><circle cx="624" cy="329" r="5" class="led"/><text x="612.0" y="333.0" class="mkey" text-anchor="end">attack_eval70</text><text x="98.0" y="355.0" class="u2">원작 식 "가능전투력 &gt; 목표기준 × 2.1 + 추가보정"은 그대로 두고, 목표 성 전투력을</text><text x="98.0" y="372.0" class="u2">0.7배로 넣습니다. 통과하기 쉬워집니다.</text><text x="98.0" y="388.0" class="k">컴퓨터만</text><polyline points="190.0,404.0 190.0,430.0" class="w" marker-end="url(#ar11)"/><polygon points="58.0,430.0 322.0,430.0 340.0,459.0 322.0,488.0 58.0,488.0 40.0,459.0" class="d og"/><text x="190.0" y="455.0" class="tt" text-anchor="middle">가능전투력 &gt; 목표기준 × 2.1 +</text><text x="190.0" y="473.0" class="tt" text-anchor="middle">추가보정 ?</text><polyline points="340.0,459.0 400.0,459.0" class="w" marker-end="url(#ar11)"/><text x="346.0" y="453.0" class="l">아니오</text><rect x="400" y="442.5" width="240" height="33" rx="14" class="sp"/><text x="412.0" y="463.5" class="u2">새 공격 없음</text><polyline points="190.0,488.0 190.0,514.0" class="w" marker-end="url(#ar11)"/><text x="198.0" y="503.0" class="l">예</text><rect x="40" y="514" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="536.0" class="tt">전력비율로 방식 11·10·9·8 선택</text><text x="52.0" y="552.0" class="u">원작 그대로</text><polyline points="190.0,564.0 190.0,590.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="590" width="600" height="94" rx="5" class="m"/><path d="M45,590 h41 v94 h-41 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="641.0" class="mk" text-anchor="middle">추가</text><text x="98.0" y="614.0" class="mt">병력이 꽉 찬 도시의 대열 출진</text><circle cx="624" cy="609" r="5" class="led"/><text x="612.0" y="613.0" class="mkey" text-anchor="end">mission_v2</text><text x="98.0" y="635.0" class="u2">병력이 최대의 90% 이상이고 여유가 4만 이상인 도시는 연결된 적 성으로 대열을 지어</text><text x="98.0" y="652.0" class="u2">나갑니다.</text><text x="98.0" y="668.0" class="k">컴퓨터만</text><polyline points="190.0,684.0 190.0,710.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="710" width="300" height="49" rx="4" class="c"/><rect x="44" y="714" width="292" height="41" rx="2" class="ci"/><text x="52.0" y="732.0" class="tt">▶ 출진 명령 실행기</text><text x="330.0" y="747.0" class="k" text-anchor="end">1EC890</text><polyline points="190.0,759.0 190.0,785.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="785" width="600" height="128" rx="5" class="m"/><path d="M45,785 h41 v128 h-41 a5,5 0 0 1 -5,-5 v-118 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="853.0" class="mk" text-anchor="middle">변경</text><text x="98.0" y="809.0" class="mt">군세 출진 편성</text><circle cx="624" cy="804" r="5" class="led"/><text x="612.0" y="808.0" class="mkey" text-anchor="end">sortie_formation</text><text x="98.0" y="830.0" class="u2">나갈지 말지는 원작이 정하고, 누구를 얼마나 보낼지를 다시 짭니다.</text><text x="98.0" y="847.0" class="u2">병력에 따라 2~7부대, 공성 진형은 8,000명 상한.</text><text x="98.0" y="864.0" class="u2">여무장과 통솔 60 이하 무장은 1,000명 지원 부대. 범위 개성 무장을 넣고 주장과</text><text x="98.0" y="881.0" class="u2">친애인 무장을 먼저 고릅니다.</text><text x="98.0" y="897.0" class="k">컴퓨터만 · 원작 명령은 두고 복사본으로 실행</text><polyline points="190.0,913.0 190.0,939.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="939" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="961.0" class="tt">출진 직후 재점검</text><text x="52.0" y="977.0" class="u">아군 전력을 다시 보고 회군을 판단</text><polyline points="190.0,989.0 190.0,1015.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="1015" width="600" height="78" rx="5" class="m"/><path d="M45,1015 h41 v78 h-41 a5,5 0 0 1 -5,-5 v-68 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="1058.0" class="mk" text-anchor="middle">변경</text><text x="98.0" y="1039.0" class="mt">재점검 계산 보완</text><circle cx="624" cy="1034" r="5" class="led"/><text x="612.0" y="1038.0" class="mkey" text-anchor="end">mission_v2</text><text x="98.0" y="1060.0" class="u2">원작은 아군 총전력을 거점 한 곳의 전력으로 덮어써서 갓 나간 군대를 되돌리곤</text><text x="98.0" y="1077.0" class="u2">했습니다. 아군 합계를 되살립니다.</text><polyline points="190.0,1093.0 190.0,1119.0" class="w" marker-end="url(#ar11)"/><rect x="40" y="1119" width="600" height="78" rx="5" class="m"/><path d="M45,1119 h41 v78 h-41 a5,5 0 0 1 -5,-5 v-68 a5,5 0 0 1 5,-5 z" class="ms blk"/><text x="63.0" y="1162.0" class="mk" text-anchor="middle">차단</text><text x="98.0" y="1143.0" class="mt">갓 출진한 공격 군단의 회군 방지</text><circle cx="624" cy="1138" r="5" class="led"/><text x="612.0" y="1142.0" class="mkey" text-anchor="end">recall_veto</text><text x="98.0" y="1164.0" class="u2">출진 10일 안이고 병력 3,000명 이상이면 원작 군단 AI가 바로 불러들이지 못합니다.</text><text x="98.0" y="1181.0" class="u2">10일 뒤에는 원작 판단을 따릅니다.</text><polyline points="190.0,1197.0 190.0,1223.0" class="w" marker-end="url(#ar11)"/><rect x="80" y="1223" width="220" height="28" rx="14" class="en"/><text x="190.0" y="1241.5" class="pt" text-anchor="middle">군세가 야전 단계로</text></svg>