<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1377" width="680" height="1377" role="img" aria-label="야전 — 군세: 모드가 가장 많이 손대는 구간입니다. 원작이 매일 명령을 다시 쓰기 때문에 모드는 그 직후에 고쳐 씁니다."><defs><marker id="ar14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">성 공격 군세 · 매일</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="70" width="300" height="34" rx="4" class="n og"/><text x="52.0" y="92.0" class="tt">거쳐 갈 지역 작업 목록(10칸)을 따라감</text><polyline points="190.0,104.0 190.0,130.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="130" width="600" height="95" rx="5" class="m"/><path d="M45,130 h41 v95 h-41 a5,5 0 0 1 -5,-5 v-85 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="181.5" class="mk" text-anchor="middle">추가</text><text x="98.0" y="154.0" class="mt">경로 위 적 지역을 작업 목록에 넣음</text><circle cx="624" cy="149" r="5" class="led"/><text x="612.0" y="153.0" class="mkey" text-anchor="end">mission_v2</text><text x="98.0" y="175.0" class="u2">출진 성에서 목표 성까지, 최단 지역 연결보다 1개 지역 더 긴 범위에서 적·빈 지역을</text><text x="98.0" y="192.0" class="u2">최대 3개 골라 빈칸에 넣습니다. 목표마다 한 번만 넣고 실제 점령 배정은 원작이</text><text x="98.0" y="209.0" class="u2">합니다.</text><polyline points="190.0,225.0 190.0,251.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="251" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="273.0" class="tt">구성원 명령 초기화 → 성 공격</text><text x="52.0" y="289.0" class="u">원작이 매일 다시 씀</text><polyline points="190.0,301.0 190.0,327.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="327" width="600" height="78" rx="5" class="m"/><path d="M45,327 h41 v78 h-41 a5,5 0 0 1 -5,-5 v-68 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="370.0" class="mk" text-anchor="middle">추가</text><text x="98.0" y="351.0" class="mt">적 성·관문을 때리는 중이면 목표 고정</text><circle cx="624" cy="346" r="5" class="led"/><text x="612.0" y="350.0" class="mkey" text-anchor="end">hit_response</text><text x="98.0" y="372.0" class="u2">실제로 피해를 주고 있는 공성 목표는 바꾸지 못하게 잠급니다. 모드가 명령을 잠그는</text><text x="98.0" y="389.0" class="u2">경우는 이것뿐입니다.</text><polyline points="190.0,405.0 190.0,431.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="431" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="453.0" class="tt">성 앞에서 조건이 맞으면 진 건설</text><text x="52.0" y="469.0" class="u">원작에서는 드묾</text><polyline points="190.0,481.0 190.0,507.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="507" width="600" height="95" rx="5" class="m"/><path d="M45,507 h41 v95 h-41 a5,5 0 0 1 -5,-5 v-85 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="558.5" class="mk" text-anchor="middle">변경</text><text x="98.0" y="531.0" class="mt">공성 시설은 1개만, 건설 대기 없음</text><circle cx="624" cy="526" r="5" class="led"/><text x="612.0" y="530.0" class="mkey" text-anchor="end">mission_v2 · siege_ring10</text><text x="98.0" y="552.0" class="u2">목표 성 10칸 안 자기 땅, 성에서 3~10칸 지점에 공성 시설 1개. 군악대는 부대에서</text><text x="98.0" y="569.0" class="u2">6칸 안.</text><text x="98.0" y="586.0" class="u2">건설을 기다리며 서 있지 않고, 원작이 성을 공격 중이면 끼어들지 않습니다.</text><polyline points="190.0,602.0 190.0,628.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="628" width="600" height="61" rx="5" class="m"/><path d="M45,628 h41 v61 h-41 a5,5 0 0 1 -5,-5 v-51 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="662.5" class="mk" text-anchor="middle">변경</text><text x="98.0" y="652.0" class="mt">공성 중 판정을 성 1칸 안으로 좁힘</text><circle cx="624" cy="647" r="5" class="led"/><text x="612.0" y="651.0" class="mkey" text-anchor="end">siege_stall_near</text><text x="98.0" y="673.0" class="u2">성 1칸 안에 있거나 최근에 성을 때렸을 때만 공성 진행 중으로 봅니다.</text><polyline points="190.0,689.0 190.0,715.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="715" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="737.0" class="tt">부대마다 경로 배정</text><text x="52.0" y="753.0" class="u">자기 위치에서 길찾기</text><polyline points="190.0,765.0 190.0,791.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="791" width="600" height="95" rx="5" class="m"/><path d="M45,791 h41 v95 h-41 a5,5 0 0 1 -5,-5 v-85 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="842.5" class="mk" text-anchor="middle">추가</text><text x="98.0" y="815.0" class="mt">중립 방벽 돌파</text><circle cx="624" cy="810" r="5" class="led"/><text x="612.0" y="814.0" class="mkey" text-anchor="end">path_wall · obstacle</text><text x="98.0" y="836.0" class="u2">토성·석벽·철쇄가 최단 경로를 막고, 돌아가는 길이 5칸 이상이면서 4분의 1 이상</text><text x="98.0" y="853.0" class="u2">길거나 길이 없으면 가장 가까운 부대 하나가 부숩니다.</text><text x="98.0" y="870.0" class="u2">성마다 5번째로 나가는 부대는 그 성 옆 중립 방벽 하나를 부수러 갑니다.</text><polyline points="190.0,886.0 190.0,912.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="912" width="600" height="78" rx="5" class="m"/><path d="M45,912 h41 v78 h-41 a5,5 0 0 1 -5,-5 v-68 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="955.0" class="mk" text-anchor="middle">추가</text><text x="98.0" y="936.0" class="mt">목표가 바뀔 때 병참 중계점</text><circle cx="624" cy="931" r="5" class="led"/><text x="612.0" y="935.0" class="mkey" text-anchor="end">supply_relay</text><text x="98.0" y="957.0" class="u2">적 담당관이 있는 적 지역에 우리 부대가 하나뿐인데 목표가 바뀌어 떠나게 되면, 뒤쪽</text><text x="98.0" y="974.0" class="u2">아군 칸 하나를 첫 경유점으로 넣어 병참을 잇습니다.</text><polyline points="190.0,990.0 190.0,1016.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="1016" width="600" height="61" rx="5" class="m"/><path d="M45,1016 h41 v61 h-41 a5,5 0 0 1 -5,-5 v-51 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="1050.5" class="mk" text-anchor="middle">변경</text><text x="98.0" y="1040.0" class="mt">군세 이동력 통일</text><circle cx="624" cy="1035" r="5" class="led"/><text x="612.0" y="1039.0" class="mkey" text-anchor="end">sortie_formation</text><text x="98.0" y="1061.0" class="u2">모드가 편성한 군세의 구성원은 가장 느린 구성원의 평지 기준 이동력을 같이 씁니다.</text><polyline points="190.0,1077.0 190.0,1103.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="1103" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="1125.0" class="tt">임무가 끝난 군세 퇴각</text><text x="52.0" y="1141.0" class="u">원작: 3,000명 이하는 바로 귀환</text><polyline points="190.0,1153.0 190.0,1179.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="1179" width="600" height="78" rx="5" class="m"/><path d="M45,1179 h41 v78 h-41 a5,5 0 0 1 -5,-5 v-68 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="1222.0" class="mk" text-anchor="middle">변경</text><text x="98.0" y="1203.0" class="mt">1,000명 지원 부대는 바로 돌아가지 않음</text><circle cx="624" cy="1198" r="5" class="led"/><text x="612.0" y="1202.0" class="mkey" text-anchor="end">sortie_formation</text><text x="98.0" y="1224.0" class="u2">모드가 편성한 지원·소규모 부대는 원작의 3,000명 이하 퇴각 조건으로 출진 다음 날</text><text x="98.0" y="1241.0" class="u2">돌아가지 않게 합니다.</text><polyline points="190.0,1257.0 190.0,1283.0" class="w" marker-end="url(#ar14)"/><rect x="40" y="1283" width="600" height="78" rx="5" class="m"/><path d="M45,1283 h41 v78 h-41 a5,5 0 0 1 -5,-5 v-68 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="1326.0" class="mk" text-anchor="middle">추가</text><text x="98.0" y="1307.0" class="mt">40일 제자리 부대 퇴각</text><circle cx="624" cy="1302" r="5" class="led"/><text x="612.0" y="1306.0" class="mkey" text-anchor="end">stationary_retreat</text><text x="98.0" y="1328.0" class="u2">같은 자리에서 40일 동안 움직이지 못한 부대를 귀환시킵니다. 공성 중인 부대는</text><text x="98.0" y="1345.0" class="u2">제외합니다.</text></svg>