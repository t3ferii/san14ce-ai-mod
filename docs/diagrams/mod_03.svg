<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 844" width="680" height="844" role="img" aria-label="요격: 컴퓨터의 요격 출진은 원작 그대로이고, 위임 군단과 이미 나간 부대의 대응만 바뀝니다."><defs><marker id="ar12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">요격</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar12)"/><rect x="40" y="70" width="300" height="68" rx="4" class="n og"/><text x="52.0" y="92.0" class="tt">요격할 적 군세를 고르고 무장·진형·병력을</text><text x="52.0" y="110.0" class="tt">정함</text><text x="52.0" y="126.0" class="u">컴퓨터의 요격 출진 판단은 원작 그대로</text><polyline points="190.0,138.0 190.0,164.0" class="w" marker-end="url(#ar12)"/><rect x="40" y="164" width="300" height="49" rx="4" class="c"/><rect x="44" y="168" width="292" height="41" rx="2" class="ci"/><text x="52.0" y="186.0" class="tt">▶ 출진 명령 실행기</text><text x="330.0" y="201.0" class="k" text-anchor="end">1EC890</text><polyline points="190.0,213.0 190.0,239.0" class="w" marker-end="url(#ar12)"/><rect x="40" y="239" width="600" height="111" rx="5" class="m"/><path d="M45,239 h41 v111 h-41 a5,5 0 0 1 -5,-5 v-101 a5,5 0 0 1 5,-5 z" class="ms blk"/><text x="63.0" y="298.5" class="mk" text-anchor="middle">차단</text><text x="98.0" y="263.0" class="mt">지원·내정 방침 군단의 군사 출진 차단</text><circle cx="624" cy="258" r="5" class="led"/><text x="612.0" y="262.0" class="mkey" text-anchor="end">district_intercept_block</text><text x="98.0" y="284.0" class="u2">지원 방침: 수송 출진만 허용.</text><text x="98.0" y="301.0" class="u2">내정 방침: 요격·지역 점령·공격 출진을 막고 수송·건설은 허용.</text><text x="98.0" y="318.0" class="u2">원작은 방침과 상관없이 위임 군단도 요격 출진을 냅니다.</text><text x="98.0" y="334.0" class="k">플레이어 위임 군단만</text><polyline points="190.0,350.0 190.0,376.0" class="w" marker-end="url(#ar12)"/><rect x="40" y="376" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="398.0" class="tt">성 공격 군세가 주변 적 부대에 대응</text><text x="52.0" y="414.0" class="u">원작 3칸</text><polyline points="190.0,426.0 190.0,452.0" class="w" marker-end="url(#ar12)"/><rect x="40" y="452" width="600" height="77" rx="5" class="m"/><path d="M45,452 h41 v77 h-41 a5,5 0 0 1 -5,-5 v-67 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="494.5" class="mk" text-anchor="middle">변경</text><text x="98.0" y="476.0" class="mt">공성군의 요격 범위 6칸</text><circle cx="624" cy="471" r="5" class="led"/><text x="612.0" y="475.0" class="mkey" text-anchor="end">siege_guard</text><text x="98.0" y="497.0" class="u2">지휘관 지력이 80 이상이면 플레이어 부대를 6칸 안에서 요격합니다.</text><text x="98.0" y="513.0" class="k">컴퓨터 공성군의 야전 부대</text><polyline points="190.0,529.0 190.0,555.0" class="w" marker-end="url(#ar12)"/><rect x="40" y="555" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="577.0" class="tt">야전 부대의 퇴각 재판정</text><text x="52.0" y="593.0" class="u">적 전력을 보고 물러날지 다시 판단</text><polyline points="190.0,605.0 190.0,631.0" class="w" marker-end="url(#ar12)"/><rect x="40" y="631" width="600" height="77" rx="5" class="m"/><path d="M45,631 h41 v77 h-41 a5,5 0 0 1 -5,-5 v-67 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="673.5" class="mk" text-anchor="middle">변경</text><text x="98.0" y="655.0" class="mt">퇴각 재판정에서 적을 60%로 평가</text><circle cx="624" cy="650" r="5" class="led"/><text x="612.0" y="654.0" class="mkey" text-anchor="end">retreat_eval60</text><text x="98.0" y="676.0" class="u2">쉽게 물러나지 않게 됩니다. 요격 평가 자체는 원작 그대로입니다.</text><text x="98.0" y="692.0" class="k">컴퓨터만</text><polyline points="190.0,708.0 190.0,734.0" class="w" marker-end="url(#ar12)"/><rect x="40" y="734" width="600" height="94" rx="5" class="m"/><path d="M45,734 h41 v94 h-41 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z" class="ms add"/><text x="63.0" y="785.0" class="mk" text-anchor="middle">추가</text><text x="98.0" y="758.0" class="mt">매복 부대는 컴퓨터 탐색에서 빠짐</text><circle cx="624" cy="753" r="5" class="led"/><text x="612.0" y="757.0" class="mkey" text-anchor="end">ambush</text><text x="98.0" y="779.0" class="u2">매복 출진한 플레이어 부대는 30일 동안 컴퓨터의 임무·목표 탐색에서 퇴각 중인</text><text x="98.0" y="796.0" class="u2">부대처럼 빠집니다. 가까이 붙으면 싸움은 납니다.</text><text x="98.0" y="812.0" class="k">플레이어 전용 · 그동안 기동력 절반</text></svg>