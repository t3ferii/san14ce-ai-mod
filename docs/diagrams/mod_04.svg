<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="수송: 컴퓨터의 수송 판단은 원작 그대로입니다. 바뀌는 곳은 한 군데입니다."><defs><marker id="ar13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">수송</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar13)"/><rect x="40" y="70" width="300" height="52" rx="4" class="n og"/><text x="52.0" y="92.0" class="tt">자원·병력 기준 중 하나를 넘는 거점이 출발</text><text x="52.0" y="110.0" class="tt">후보</text><polyline points="190.0,122.0 190.0,148.0" class="w" marker-end="url(#ar13)"/><polygon points="58.0,148.0 322.0,148.0 340.0,168.0 322.0,188.0 58.0,188.0 40.0,168.0" class="d og"/><text x="190.0" y="173.0" class="tt" text-anchor="middle">거점 15칸 안에 적 부대가 없는가 ?</text><polyline points="340.0,168.0 400.0,168.0" class="w" marker-end="url(#ar13)"/><text x="346.0" y="162.0" class="l">있다</text><rect x="400" y="151.5" width="240" height="33" rx="14" class="sp"/><text x="412.0" y="172.5" class="u2">출발지에서 뺌</text><polyline points="190.0,188.0 190.0,214.0" class="w" marker-end="url(#ar13)"/><text x="198.0" y="203.0" class="l">예</text><rect x="40" y="214" width="600" height="94" rx="5" class="m"/><path d="M45,214 h41 v94 h-41 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z" class="ms chg"/><text x="63.0" y="265.0" class="mk" text-anchor="middle">변경</text><text x="98.0" y="238.0" class="mt">지원·내정 군단은 15칸 검사를 통과 처리</text><circle cx="624" cy="233" r="5" class="led"/><text x="612.0" y="237.0" class="mkey" text-anchor="end">district_intercept_block</text><text x="98.0" y="259.0" class="u2">요격이 막힌 군단은 적을 치우지 못해 수송이 영영 나가지 않습니다. 이 군단의 거점에</text><text x="98.0" y="276.0" class="u2">한해 이 검사만 참으로 봅니다.</text><text x="98.0" y="292.0" class="k">플레이어 위임 군단만</text><polyline points="190.0,308.0 190.0,334.0" class="w" marker-end="url(#ar13)"/><rect x="40" y="334" width="300" height="50" rx="4" class="n og"/><text x="52.0" y="356.0" class="tt">도착 후보와 필요량 계산 → 수송 출진</text><text x="52.0" y="372.0" class="u">원작 그대로</text></svg>