<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="680" height="510" role="img" aria-label="하루 판단 순서: 위에서 아래로 차례로 돕니다. 경유점은 매일 처음부터 다시 쓰입니다."><defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">세력 하나의 하루 판단</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar1)"/><rect x="40" y="70" width="300" height="65" rx="4" class="n"/><text x="52.0" y="92.0" class="tt">1. 세력 판단표</text><text x="52.0" y="108.0" class="u">공략할 세력, 외교, 세력 방침</text><text x="330.0" y="123.0" class="k" text-anchor="end">N0~N245</text><polyline points="190.0,135.0 190.0,161.0" class="w" marker-end="url(#ar1)"/><rect x="40" y="161" width="300" height="65" rx="4" class="n"/><text x="52.0" y="183.0" class="tt">2. 군단 판단표 (군단마다)</text><text x="52.0" y="199.0" class="u">출진·요격·수송·내정을 정함</text><text x="330.0" y="214.0" class="k" text-anchor="end">N0~N10789</text><polyline points="190.0,226.0 190.0,252.0" class="w" marker-end="url(#ar1)"/><rect x="40" y="252" width="300" height="81" rx="4" class="n"/><text x="52.0" y="274.0" class="tt">3. 군세 판단표 (군세마다)</text><text x="52.0" y="290.0" class="u">실행 직전 구성원 경유점 5칸을 비움</text><text x="52.0" y="306.0" class="u">임무 실행, 재판단 요청 시 최대 10회</text><text x="330.0" y="321.0" class="k" text-anchor="end">N0~N347</text><polyline points="190.0,333.0 190.0,359.0" class="w" marker-end="url(#ar1)"/><rect x="40" y="359" width="300" height="81" rx="4" class="n"/><text x="52.0" y="381.0" class="tt">4. 부대 판단표 (부대마다)</text><text x="52.0" y="397.0" class="u">화계·병참·주변 점령. 같은 날 군세가 쓴</text><text x="52.0" y="413.0" class="u">명령을 덮어쓸 수 있음</text><text x="330.0" y="428.0" class="k" text-anchor="end">N0~N110</text><polyline points="190.0,440.0 190.0,466.0" class="w" marker-end="url(#ar1)"/><rect x="80" y="466" width="220" height="28" rx="14" class="en"/><text x="190.0" y="484.5" class="pt" text-anchor="middle">다음 세력으로</text></svg>