 y="588.0" class="tt">방식 10</text><text x="201.0" y="603.0" class="u">성 앞 진 건설 검토 켬</text><polyline points="416.5,532.0 416.5,552.0" class="w" marker-end="url(#ar3)"/><rect x="346.0" y="552" width="141.0" height="63" rx="4" class="n"/><text x="354.0" y="569.0" class="l">200 초과 400 이하</text><text x="354.0" y="588.0" class="tt">방식 9</text><polyline points="569.5,532.0 569.5,552.0" class="w" marker-end="url(#ar3)"/><rect x="499.0" y="552" width="141.0" height="63" rx="4" class="n"/><text x="507.0" y="569.0" class="l">400 초과</text><text x="507.0" y="588.0" class="tt">방식 8</text><text x="507.0" y="603.0" class="u">대군</text><polyline points="110.5,615.0 110.5,629.0" class="w"/><polyline points="263.5,615.0 263.5,629.0" class="w"/><polyline points="416.5,615.0 416.5,629.0" class="w"/><polyline points="569.5,615.0 569.5,629.0" class="w"/><polyline points="110.5,629.0 569.5,629.0" class="w"/><circle cx="190" cy="629.0" r="3.5" class="j"/><polyline points="190.0,629.0 190.0,651.0" class="w" marker-end="url(#ar3)"/><rect x="40" y="651" width="300" height="81" rx="4" class="c"/><rect x="44" y="655" width="292" height="73" rx="2" class="ci"/><text x="52.0" y="673.0" class="tt">▶ 성 공격 출진 명령</text><text x="52.0" y="689.0" class="u">부대를 만들고 군세로 묶어 방식 번호와 목표</text><text x="52.0" y="705.0" class="u">성을 기록</text><text x="330.0" y="720.0" class="k" text-anchor="end">1EC890</text><polyline points="190.0,732.0 190.0,758.0" class="w" marker-end="url(#ar3)"/><rect x="80" y="758" width="220" height="28" rx="14" class="en"/><text x="190.0" y="776.5" class="pt" text-anchor="middle">군세가 야전 단계로</text></svg>