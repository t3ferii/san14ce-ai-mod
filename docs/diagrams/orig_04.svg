<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 386" width="680" height="386" role="img" aria-label="출진 — 증원: 공격 중인 목표에 전력이 모자라면 방식 22로 더 보냅니다."><defs><marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><style>svg{--bg:#eef2f0;--sheet:#f8faf9;--grid:#d5ddd9;--surface:#ffffff;--fg:#14201c;--muted:#5a6964;--wire:#1f5f52;--line:#b9c6c1;--cond:#3040a0;--cond-bg:#e6e9fa;--act:#0b6e52;--act-bg:#dcf2e9;--chip-bg:#eef1f0;--stop:#7a8480;--mod:#a85400;--mod-bg:#fdf0de;--blk:#b3261e;--add:#0b6e52;--chg:#3040a0;--tagfg:#ffffff;}@media (prefers-color-scheme:dark){svg{--bg:#0b100e;--sheet:#0f1714;--grid:#1d2925;--surface:#17211d;--fg:#e4ebe8;--muted:#96a6a0;--wire:#6fd4b8;--line:#33423d;--cond:#a9b4ff;--cond-bg:#1c2346;--act:#62d6ae;--act-bg:#11352a;--chip-bg:#1b2622;--stop:#8a9792;--mod:#ffb866;--mod-bg:#33250f;--blk:#ff8a80;--add:#62d6ae;--chg:#a9b4ff;--tagfg:#0b100e}}.bg{fill:var(--sheet)}svg text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;fill:var(--fg)}.w{fill:none;stroke:var(--wire);stroke-width:1.6}.w2{stroke:var(--line);stroke-width:1.2}.rl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}.ah{fill:var(--wire)}.j{fill:var(--wire)}.n{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.d{fill:var(--cond-bg);stroke:var(--cond);stroke-width:1.4}.c{fill:var(--act-bg);stroke:var(--act);stroke-width:1.6}.ci{fill:none;stroke:var(--act);stroke-width:.8}.ch{fill:var(--chip-bg);stroke:var(--fg);stroke-width:1.4}.pin{fill:var(--fg)}.sp{fill:var(--sheet);stroke:var(--stop);stroke-width:1.2;stroke-dasharray:5 3}.st{fill:var(--fg);stroke:none}.en{fill:var(--sheet);stroke:var(--fg);stroke-width:1.2}svg text.pt{font-size:12.5px;font-weight:700}.st+text.pt{fill:var(--bg)}svg text.tt{font-size:13px;font-weight:700}svg text.u{font-size:11.8px;fill:var(--muted)}svg text.u2{font-size:12.5px}svg text.mo{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11.3px}svg text.k{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:10.5px;fill:var(--muted)}svg text.l{font-size:11px;font-weight:700;fill:var(--cond)}svg text.ov{font-size:12.5px;font-weight:700;fill:var(--act)}.og{stroke:var(--line);stroke-width:1.1}.m{fill:var(--mod-bg);stroke:var(--mod);stroke-width:1.8}.ms.chg{fill:var(--chg)}.ms.add{fill:var(--add)}.ms.blk{fill:var(--blk)}svg text.mk{font-size:12px;font-weight:700;fill:var(--tagfg)}svg text.mt{font-size:13.5px;font-weight:700}svg text.mkey{font-family:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;font-size:11px;fill:var(--mod)}.led{fill:var(--mod);stroke:var(--mod-bg);stroke-width:1.5}.ledoff{fill:none;stroke:var(--muted);stroke-width:1.2}</style><rect width="100%" height="100%" rx="8" class="bg"/><rect x="80" y="16" width="220" height="28" rx="14" class="st"/><text x="190.0" y="34.5" class="pt" text-anchor="middle">이미 공격 중인 목표</text><polyline points="190.0,44.0 190.0,70.0" class="w" marker-end="url(#ar4)"/><rect x="40" y="70" width="300" height="66" rx="4" class="n"/><text x="52.0" y="92.0" class="tt">전력 재계산</text><text x="52.0" y="108.0" class="u">목표 주변 5칸 전력</text><text x="52.0" y="124.0" class="u">기존 아군 전력 × 0.8</text><polyline points="190.0,136.0 190.0,162.0" class="w" marker-end="url(#ar4)"/><polygon points="58.0,162.0 322.0,162.0 340.0,182.0 322.0,202.0 58.0,202.0 40.0,182.0" class="d"/><text x="190.0" y="187.0" class="tt" text-anchor="middle">목표요구값 &gt; 기존 아군전력 ?</text><polyline points="340.0,182.0 400.0,182.0" class="w" marker-end="url(#ar4)"/><text x="346.0" y="176.0" class="l">아니오</text><rect x="400" y="165.5" width="240" height="33" rx="14" class="sp"/><text x="412.0" y="186.5" class="u2">증원 없음</text><polyline points="190.0,202.0 190.0,228.0" class="w" marker-end="url(#ar4)"/><text x="198.0" y="217.0" class="l">예</text><rect x="40" y="228" width="300" height="66" rx="4" class="n"/><text x="52.0" y="250.0" class="tt">추가 출진 후보 모음</text><text x="52.0" y="266.0" class="u">후보를 더한 합이 요구값을 넘으면 요구값에서</text><text x="52.0" y="282.0" class="u">기존 아군전력을 뺌</text><polyline points="190.0,294.0 190.0,320.0" class="w" marker-end="url(#ar4)"/><rect x="40" y="320" width="300" height="50" rx="4" class="c"/><rect x="44" y="324" width="292" height="42" rx="2" class="ci"/><text x="52.0" y="342.0" class="tt">▶ 증원 출진 명령 · 방식 22</text><text x="52.0" y="358.0" class="u">합이 기준을 못 넘어도 시도는 실행됨</text></svg>